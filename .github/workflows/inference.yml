name: OWoTGPT Runner

on:
  workflow_dispatch:
    inputs:
      owot_token:
        description: "Optional OWOT token cookie to use for this run"
        required: false
      owot_password:
        description: "Optional OWOT password for the owotgpt. account"
        required: false
      github_token:
        description: "Optional GitHub token for gist sync or release access"
        required: false
      world_name:
        description: "Optional OWOT world name for the main connection"
        required: false
      network_world_name:
        description: "Optional OWOT world name for the network connection"
        required: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install tensorflow-cpu==2.15.0 gpt-2-simple websockets

      - name: Download Model Assets from Release
        run: |
          # Downloads the owotgpt.tar file from your latest GitHub Release
          gh release download --pattern 'owotgpt.tar'
        env:
          GITHUB_TOKEN: ${{ github.event.inputs.github_token || secrets.GITHUB_TOKEN }}

      - name: Extract Model
        run: |
          # Since the tar contains the 'checkpoint/owotgpt' folders already,
          # we just extract it here.
          tar -xvf owotgpt.tar

      - name: Run OWoTGPT Bot
        env:
          OWOT_TOKEN: ${{ github.event.inputs.owot_token }}
          OWOT_PASSWORD: ${{ github.event.inputs.owot_password }}
          GITHUB_TOKEN: ${{ github.event.inputs.github_token || secrets.GITHUB_TOKEN }}
          OWOT_WORLD_NAME: ${{ github.event.inputs.world_name }}
          OWOT_NETWORK_WORLD_NAME: ${{ github.event.inputs.network_world_name }}
        run: |
          # 21000s = 5 hours 50 minutes. 
          # This allows the bot to run almost the full 6h Action limit.
          timeout 21000s python bot.py || echo "Finished 6h session"
